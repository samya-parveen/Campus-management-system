<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Store Billing</title>
    <link rel="stylesheet" href="../css/billing.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-box">
          <div class="brand-mark">CS</div>
          <div>
            <p class="eyebrow">Campus Store</p>
            <h2>Billing Desk</h2>
          </div>
        </div>

        <nav class="sidebar-nav">
          <button class="nav-item active">Dashboard</button>
          <button class="nav-item">Products</button>
          <button class="nav-item">Customers</button>
          <button class="nav-item">Billing</button>
          <button class="nav-item">Reports</button>
        </nav>

        <div class="sidebar-card">
          <p class="eyebrow">Today</p>
          <h3 id="todaySales">₹0.00</h3>
          <span>Sales recorded</span>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Sales Counter</p>
            <h1>Billing</h1>
          </div>
          <div class="topbar-actions">
            <button class="secondary-btn">Export</button>
            <button class="primary-btn">New Invoice</button>
          </div>
        </header>

        <section class="billing-grid">
          <div class="invoice-panel card">
            <div class="panel-header">
              <h3>Invoice Details</h3>
              <span class="badge">#INV-1048</span>
            </div>

            <div class="info-grid">
              <div>
                <label>Customer</label>
                <input id="customerName" type="text" value="Walk-in Customer" />
              </div>
              <div>
                <label>Invoice No.</label>
                <input id="invoiceNo" type="text" value="INV-1048" />
              </div>
              <div>
                <label>Date</label>
                <input id="invoiceDate" type="date" />
              </div>
              <div>
                <label>Cashier</label>
                <input id="cashierName" type="text" value="Aditi Sharma" />
              </div>
            </div>

            <div class="product-controls">
              <div class="search-box">
                <input id="productSearch" type="text" placeholder="Search product by name or code" />
              </div>
              <button id="addProductBtn" class="primary-btn">Add Product</button>
            </div>

            <div id="productList" class="product-list"></div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Total</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="cartTable"></tbody>
              </table>
            </div>
          </div>

          <aside class="summary-panel card">
            <div class="panel-header">
              <h3>Order Summary</h3>
            </div>

            <div class="summary-box">
              <div class="summary-row">
                <span>Subtotal</span>
                <strong id="subtotalValue">₹0.00</strong>
              </div>
              <div class="summary-row">
                <span>Discount</span>
                <strong id="discountValue">₹0.00</strong>
              </div>
              <div class="summary-row">
                <span>Tax (5%)</span>
                <strong id="taxValue">₹0.00</strong>
              </div>
              <div class="summary-row total-row">
                <span>Total Due</span>
                <strong id="totalValue">₹0.00</strong>
              </div>
            </div>

            <div class="payment-section">
              <label for="paymentMethod">Payment Method</label>
              <select id="paymentMethod">
                <option value="Cash">Cash</option>
                <option value="Card">Card</option>
                <option value="UPI">UPI</option>
              </select>

              <label for="cashReceived">Cash Received</label>
              <input id="cashReceived" type="number" min="0" step="0.01" placeholder="0.00" />

              <div class="summary-row">
                <span>Change</span>
                <strong id="changeValue">₹0.00</strong>
              </div>
            </div>

            <div class="action-stack">
              <button id="processPaymentBtn" class="primary-btn wide">Process Payment</button>
              <button id="saveInvoiceBtn" class="secondary-btn wide">Save Invoice</button>
              <button id="printInvoiceBtn" class="ghost-btn wide">Print Receipt</button>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <script src="../js/billing.js"></script>
  </body>
</html>
