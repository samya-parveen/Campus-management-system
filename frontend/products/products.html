<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSMS - Product Management</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        display: flex;
        min-height: 100vh;
        background: #f1f5f9;
      }

      /* Sidebar */
      .sidebar {
        width: 240px;
        background: #172554;
        color: white;
        padding: 25px 20px;
        flex-shrink: 0;
      }

      .sidebar h2 {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .sidebar p {
        color: #cbd5e1;
        font-size: 12px;
        margin-bottom: 35px;
      }

      .sidebar a {
        display: block;
        padding: 14px;
        margin-bottom: 10px;
        text-decoration: none;
        color: white;
        border-radius: 6px;
      }

      .sidebar a:hover,
      .sidebar a.active {
        background: #2563eb;
      }

      /* Main Content */
      .main-content {
        flex: 1;
        min-width: 0;
        padding: 30px;
      }

      header h1 {
        color: #172554;
        margin-bottom: 8px;
      }

      header p {
        color: #64748b;
      }

      /* Statistics */
      .stats {
        display: flex;
        gap: 20px;
        margin: 30px 0;
        flex-wrap: wrap;
      }

      .stat-card {
        background: white;
        padding: 25px;
        width: 220px;
        border-radius: 10px;
        box-shadow: 0 2px 8px #00000010;
      }

      .stat-card h3 {
        color: #64748b;
        font-size: 15px;
        margin-bottom: 12px;
      }

      .stat-card h2 {
        color: #2563eb;
        font-size: 30px;
      }

      /* Product Section */
      .product-section {
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px #00000010;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        gap: 15px;
      }

      .section-header h2 {
        color: #172554;
      }

      button,
      .add-btn {
        border: none;
        padding: 11px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        text-decoration: none;
      }

      .add-btn,
      .edit-btn {
        background: #2563eb;
        color: white;
      }

      .delete-btn {
        background: #dc2626;
        color: white;
      }

      .controls {
        display: flex;
        gap: 15px;
        margin-bottom: 25px;
      }

      .controls input,
      .controls select {
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
      }

      .controls input {
        flex: 1;
        min-width: 0;
      }

      /* Table */
      .table-container {
        width: 100%;
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 650px;
        border-collapse: collapse;
      }

      thead {
        background: #172554;
        color: white;
      }

      th,
      td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
      }

      tbody tr:hover {
        background: #f1f5f9;
      }

      #emptyMessage {
        display: none;
        text-align: center;
        color: #64748b;
        padding: 20px;
      }

      @media (max-width: 768px) {
        .sidebar {
          width: 160px;
          padding: 15px 10px;
        }

        .main-content {
          padding: 15px;
        }

        .controls {
          flex-direction: column;
        }
      }

      @media (max-width: 480px) {
        body {
          display: block;
        }

        .sidebar {
          width: 100%;
          min-height: auto;
        }

        .sidebar a {
          display: inline-block;
          padding: 10px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>CSMS</h2>
      <p>Campus Store Management</p>

      <a href="../dashboard.html">Dashboard</a>
      <a href="products.html" class="active">Products</a>
      <a href="../billing/">Billing</a>
      <a href="../reports/">Reports</a>
      <a href="../login.html">Logout</a>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header>
        <h1>Product Management</h1>
        <p>Manage all campus store products here.</p>
      </header>

      <!-- Statistics -->
      <section class="stats">
        <div class="stat-card">
          <h3>Total Products</h3>
          <h2 id="totalProducts">0</h2>
        </div>

        <div class="stat-card">
          <h3>Total Categories</h3>
          <h2>3</h2>
        </div>
      </section>

      <!-- Product List -->
      <section class="product-section">
        <div class="section-header">
          <h2>Product List</h2>

          <a href="add-products.html" class="add-btn"> + Add Product </a>
        </div>

        <!-- Search -->
        <div class="controls">
          <input
            type="text"
            id="searchInput"
            placeholder="Search product by name or ID..."
          />

          <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="Book">Book</option>
            <option value="Accessory">Accessory</option>
            <option value="Stationery">Stationery</option>
          </select>
        </div>

        <!-- Table -->
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Base Price</th>
                <th>Quantity</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="productTable"></tbody>
          </table>

          <p id="emptyMessage">No products found.</p>
        </div>
      </section>
    </main>

    <script>
      // Default Products

      const defaultProducts = [
        {
          id: 101,
          name: "C++ Textbook",
          category: "Book",
          price: 500,
          quantity: 10,
        },
        {
          id: 102,
          name: "USB Mouse",
          category: "Accessory",
          price: 800,
          quantity: 15,
        },
        {
          id: 103,
          name: "Pen Set",
          category: "Stationery",
          price: 200,
          quantity: 20,
        },
      ];

      // Load Products

      let products =
        JSON.parse(localStorage.getItem("csmsProducts")) || defaultProducts;

      function saveProducts() {
        localStorage.setItem("csmsProducts", JSON.stringify(products));
      }

      // Display Products

      function displayProducts() {
        const table = document.getElementById("productTable");
        const search = document
          .getElementById("searchInput")
          .value.toLowerCase();

        const category = document.getElementById("categoryFilter").value;

        table.innerHTML = "";

        const filtered = products.filter((product) => {
          const matchSearch =
            product.name.toLowerCase().includes(search) ||
            String(product.id).includes(search);

          const matchCategory =
            category === "" || product.category === category;

          return matchSearch && matchCategory;
        });

        document.getElementById("totalProducts").textContent = products.length;

        document.getElementById("emptyMessage").style.display =
          filtered.length === 0 ? "block" : "none";

        filtered.forEach((product) => {
          const row = document.createElement("tr");

          const values = [
            product.id,
            product.name,
            product.category,
            "₹" + Number(product.price).toFixed(2),
            product.quantity,
          ];

          values.forEach((value) => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          });

          const actions = document.createElement("td");

          const edit = document.createElement("button");
          edit.textContent = "Edit";
          edit.className = "edit-btn";

          edit.onclick = () => {
            location.href =
              "add-products.html?id=" + encodeURIComponent(product.id);
          };

          const remove = document.createElement("button");
          remove.textContent = "Delete";
          remove.className = "delete-btn";

          remove.onclick = () => deleteProduct(product.id);

          actions.appendChild(edit);
          actions.appendChild(remove);

          row.appendChild(actions);
          table.appendChild(row);
        });
      }

      // Delete Product

      function deleteProduct(id) {
        if (confirm("Do you want to delete this product?")) {
          products = products.filter((p) => p.id !== id);

          saveProducts();
          displayProducts();

          alert("Product deleted successfully!");
        }
      }

      // Search and Filter

      document
        .getElementById("searchInput")
        .addEventListener("input", displayProducts);

      document
        .getElementById("categoryFilter")
        .addEventListener("change", displayProducts);

      // Initial Display

      if (localStorage.getItem("csmsProducts") === null) {
        saveProducts();
      }

      displayProducts();
    </script>
  </body>
</html>
